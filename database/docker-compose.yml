services:
  postgres:
    image: postgres:17-alpine
    container_name: carteira-segura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carteira_segura
      POSTGRES_USER: carteira_segura
      POSTGRES_PASSWORD: carteira_segura_local
    ports:
      - "5434:5432"
    volumes:
      - carteira_segura_postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carteira_segura -d carteira_segura"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carteira_segura_postgres:
